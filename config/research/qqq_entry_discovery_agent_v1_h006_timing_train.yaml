research_id: qqq_entry_discovery_agent_v1_h006_timing_train
ticker: QQQ
research_mode: NEW_ENTRY
hypothesis: QQQ controlled-reset opportunities may improve when entry waits for the first PIT-safe stabilization confirmation.
population_source: {type: ticker_daily_calendar, frozen: false, point_in_time: true}
signal_definition:
  precursor: CONTROLLED_RESET
  confirmation: RECOVERY_AFTER_RESET
  conditions: [drawdown60 <= -0.02, ret10 > 0, ret5 > 0]
  creates_new_entry_dates: true
  timing: first_confirmation_within_precursor_episode
entry_date_rule:
  rule: first_RECOVERY_AFTER_RESET_date_within_CONTROLLED_RESET_episode
  entry_date_need_not_remain_baseline_setup: true
date_range: {start: '2010-01-01', end: '2023-12-31'}
split_policy: {train_end: '2023-12-31', validation_start: '2024-01-01', validation_end: '2025-12-31'}
contract_selection_policy: {mode: AUTHORITATIVE_CURRENT_STRATEGY_SELECTOR_WITHOUT_ENTRY_GATES, width_priority: [5, 10, 2], as_of_only: true}
lifecycle_policy: {source: AUTHORITATIVE_CURRENT_LIFECYCLE, no_future_selection: true}
frozen_parameters: {dte_min: 30, dte_max: 45, safe_strike_atr: 2.3, standardized_width: 5}
allowed_parameters: {research_only: true, contract_parameters_changed: false, lifecycle_parameters_changed: false}
final_oos_access: false
production_changes_allowed: false
