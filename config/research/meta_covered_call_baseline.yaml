research_id: covered_call_meta_baseline
ticker: META
research_mode: NEW_ENTRY
hypothesis: "Use PIT-safe stock and market context to identify covered-call entry dates under no-assignment hard constraints."
population_source: {type: ticker_daily_calendar, source: PCSDataAccess, frozen: false}
signal_definition: {name: covered_call_timing, creates_new_entry_dates: true}
entry_date_rule: {rule: stock_trend_and_market_confirmation, decision_timing: post_close}
date_range: {start: "2020-01-01", end: "2026-08-18"}
split_policy: {train: "2020-2023", validation: "2024-2025", final_oos: sealed}
contract_selection_policy: {source: PCSDataAccess, exact_contract_identity: true, select_after_signal_date: true}
lifecycle_policy: {model: LONG_100_SHARES_PLUS_SHORT_1_CALL, terminal_states: [PROFIT_CLOSE, ROLL, HARD_CONSTRAINT_CONFLICT]}
frozen_parameters: {shares: 100, multiplier: 100, assignment: FORBIDDEN}
allowed_parameters: {dte: [43], target_delta: [0.30], profit_capture: [0.60]}
rules:
  strategy: COVERED_CALL
  pit_feature_dataset: research_outputs/safe_strike_risk_map_v0_1/trend_histories/META_trend.parquet
  market_feature_dataset: data/derived/canonical_pit_market_states.parquet
  covered_call_config: {profit_capture: 0.60, mandatory_roll_days: 5}
final_oos_access: false
production_changes_allowed: false
