research_id: qqq_covered_call_human_style_train_v3
ticker: QQQ
research_mode: NEW_ENTRY
hypothesis: "Apply the identical WAIT-first opportunistic covered-call family to QQQ TRAIN without ticker-specific retuning."
population_source: {type: ticker_daily_calendar, source: PCSDataAccess, frozen: false}
signal_definition: {name: human_style_opportunistic_covered_call_v3, creates_new_entry_dates: true, inputs: [ticker_daily_calendar, trailing_price_features, trailing_option_iv]}
entry_date_rule: {rule: family_specific_rally_iv_or_pit_resistance_with_breakout_block, decision_timing: post_close}
date_range: {start: "2020-10-20", end: "2023-12-31"}
split_policy: {train: "2020-10-20/2023-12-31", historical_holdout: SEALED, validation: NOT_RUN, final_oos: SEALED}
contract_selection_policy:
  source: PCSDataAccess
  exact_contract_identity: true
  select_after_signal_date: true
  execution: {open: bid, close: ask, roll_old_leg: ask, roll_new_leg: bid}
lifecycle_policy: {model: LONG_100_SHARES_PLUS_SHORT_1_CALL, default_action: WAIT, continuous_coverage: false, forced_stock_sale: false, terminal_states: [BUY_TO_CLOSE, EXPIRE_WORTHLESS]}
frozen_parameters:
  shares: 100
  multiplier: 100
  min_open_interest: 100
  min_volume: 1
  max_spread_pct: 0.20
  breakout_definition: "close > prior_60d_high * 1.01 and return_5d > 0.06"
  acceleration_definition: "return_3d > 0.06 or (return_5d > 0.10 and close > lagged_sma20)"
  earnings_block_calendar_days: NOT_APPLICABLE_ETF
