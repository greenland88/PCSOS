research_id: covered_call_nvdl_state_matrix_v7
ticker: NVDL
research_mode: NEW_ENTRY
hypothesis: "Test a WAIT-first, state-aware covered-call policy for NVDL against buy-and-hold total return."
population_source:
  type: ticker_daily_calendar
  source: PCSDataAccess
  frozen: false
signal_definition:
  name: nvdl_state_aware_covered_call_timing
  creates_new_entry_dates: true
  inputs: [ticker_daily_calendar, trailing_price_features, trailing_option_iv, nvda_trend, qqq_confirmation]
entry_date_rule:
  rule: discover_signal_dates_from_full_pit_calendar
  decision_timing: post_session_close
date_range: {start: "2023-09-26", end: "2026-08-25"}
split_policy: {train: "2023-2025", validation: "2026", final_oos: "sealed"}
contract_selection_policy:
  source: PCSDataAccess
  exact_contract_identity: true
  select_after_signal_date: true
  dte_buckets: [[21, 35], [36, 45]]
  delta_buckets: [[0.08, 0.12], [0.12, 0.18], [0.15, 0.22]]
  atr_distance_buckets: [[2.0, 2.5], [2.5, 3.0], [3.0, 4.0]]
lifecycle_policy:
  model: LONG_100_SHARES_PLUS_SHORT_1_CALL
  terminal_states: [BUY_TO_CLOSE, EXPIRE_WORTHLESS, ASSIGNED]
  assignment_policy: FORBID_AND_FAIL_CLOSED
frozen_parameters: {shares: 100, multiplier: 100}
allowed_parameters:
  profit_capture: [0.50, 0.65, 0.75, 0.85]
  max_covered_fraction: [0.25, 0.50, 0.75]
  candidate_configs:
    - {state: RALLY_IV, delta: [0.08, 0.12], dte: [21, 35], min_atr_distance: 2.5}
    - {state: RESISTANCE_STALL, delta: [0.15, 0.22], dte: [21, 35], min_atr_distance: 2.0}
    - {state: NORMAL_UPTREND, delta: [0.08, 0.15], dte: [36, 45], min_atr_distance: 3.0}
rules:
  strategy: COVERED_CALL
  engine: NVDL_STATE_AWARE_RESEARCH_V1
  objective: TOTAL_RETURN_NET_OF_CALL_MANAGEMENT_AND_UPSIDE_SACRIFICED
  covered_call_config:
    event_window_days: 7
    mandatory_roll_days: 5
    commission_per_contract: 0.65
    slippage_per_contract: 0.05
  pit_feature_dataset: research_inputs/nvdl_covered_call/NVDL_pit_features.parquet
  market_feature_dataset: research_inputs/nvdl_covered_call/market_features.parquet
final_oos_access: false
production_changes_allowed: false
